[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
# The lowest version the code (let chains) and the locked dependency tree
# need. CI runs the whole test suite on it. See "Rust version" in
# docs/design.md.
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/kelchm/scrobl"
# Nothing is published until the owner decides to release.
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
todo = "warn"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
indexing_slicing = "warn"
