[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
# The lowest version the library's code (let chains) and its locked
# dependencies need. CI runs the library's tests on it. The command-line
# tool needs more and says so itself. See "Rust version" in docs/design.md.
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/kelchm/scrobl"
# Not on crates.io until the owner decides to publish there.
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
todo = "warn"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
indexing_slicing = "warn"
