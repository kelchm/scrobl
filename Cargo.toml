[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
# Provisional: the floor of the planned Tauri 2 consumer. Checked in CI.
rust-version = "1.90"
repository = "https://github.com/kelchm/scrobl"
# No license has been chosen yet, so nothing here may be published.
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
todo = "warn"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
indexing_slicing = "warn"
