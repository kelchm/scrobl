name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  # By hand, for a tag that has no image or no release: one older than this
  # workflow, or one whose run failed. The program comes from the tag, and the
  # workflow and the Dockerfile from the branch the run starts on. Nothing is
  # published to crates.io by hand here: a version there cannot be replaced.
  workflow_dispatch:
    inputs:
      tag:
        description: An existing tag, such as v0.1.0
        required: true

permissions:
  contents: read

env:
  IMAGE: ghcr.io/kelchm/scrobl
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  # Both crates. crates.io trusts this workflow of this repository, so no
  # token is stored: the action trades the run's identity for one that lasts
  # half an hour.
  crates:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # A version is a commit of `main`. A tag put anywhere else would
      # publish what was never merged, and that could not be taken back.
      - run: git merge-base --is-ancestor HEAD origin/main
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
      # The tag is the one version every crate has.
      - run: >
          test "${TAG#v}" = "$(cargo metadata --no-deps --format-version 1
          | jq -r '[.packages[].version] | unique | join(" ")')"
      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        id: auth
      # The library first, and only what is not there yet, so that a run
      # which failed between the two can simply be run again.
      - run: |
          for crate in scrobl scrobl-cli; do
            status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
              --user-agent "scrobl-release (+https://github.com/kelchm/scrobl)" \
              "https://crates.io/api/v1/crates/$crate/${TAG#v}")
            case "$status" in
              200) echo "$crate ${TAG#v} is already on crates.io" ;;
              404) cargo publish --locked --package "$crate" ;;
              *) echo "crates.io answered $status for $crate"; exit 1 ;;
            esac
          done
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  # After the crates, or by itself in a run by hand, where they are skipped.
  image:
    needs: crates
    if: ${{ !cancelled() && (needs.crates.result == 'success' || needs.crates.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          path: source
          persist-credentials: false
      # The image's tag is the version its `scrobl --version` prints.
      - run: >
          test "${TAG#v}" = "$(cargo metadata --no-deps --format-version 1 --manifest-path source/Cargo.toml
          | jq -r '.packages[] | select(.name == "scrobl-cli") | .version')"
      - run: docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin <<< "$GITHUB_TOKEN"
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: >
          docker buildx build --push --platform linux/amd64 --provenance=mode=max
          --file Dockerfile
          --tag "$IMAGE:${TAG#v}"
          --label "org.opencontainers.image.version=${TAG#v}"
          --label "org.opencontainers.image.revision=$(git -C source rev-parse HEAD)"
          source

  release:
    needs: image
    # Said outright, because a job skipped earlier in the chain would skip
    # this one too.
    if: ${{ !cancelled() && needs.image.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - run: gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
