name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets --all-features
      # The protocol core alone is the library on its own: built with the
      # command-line tool, which needs the client, the feature would be on.
      - run: cargo clippy --locked --all-targets --no-default-features -p scrobl
      - run: cargo test --locked --all-features
      - run: cargo test --locked --no-default-features -p scrobl
      - run: cargo doc --locked --no-deps --all-features
      - run: cargo doc --locked --no-deps --no-default-features -p scrobl
      # Advisories are checked in `audit.yml`.
      - run: cargo deny check licenses
      # What would be published must build and pass its own tests, away from
      # the repository around it.
      - run: cargo package --locked -p scrobl
      - run: cargo test --locked --manifest-path target/package/scrobl-*/Cargo.toml

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
      # The floor sits just under what the suite measures, so a change that
      # adds untested code fails here. Raise it as coverage rises.
      - run: cargo llvm-cov --locked --all-features --fail-under-lines 95

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build --tag scrobl:ci .
      - run: docker run --rm --read-only scrobl:ci --version
      # As a cluster runs it: the image's own user, a read-only root and a
      # volume at `/data`. Without a network the sync creates the database
      # and then fails, so no request leaves the runner.
      - run: |
          status=0
          docker run --name sync --read-only --network none --env SCROBL_API_KEY=none \
            --volume data:/data scrobl:ci sync --db /data/history.db --user nobody || status=$?
          test "$status" -eq 1
          docker cp sync:/data/history.db .
          head -c 15 history.db | grep -qx 'SQLite format 3'

  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The runner's own rustup, not mise: this job is about the declared
      # minimums, not the pinned toolchain. The library declares 1.88 and the
      # command-line tool 1.89, which its SQLite binding needs.
      - run: rustup toolchain install 1.88 1.89 --profile minimal
      - run: cargo +1.88 test --locked --all-features -p scrobl
      - run: cargo +1.88 test --locked --no-default-features -p scrobl
      - run: cargo +1.89 test --locked -p scrobl-cli
