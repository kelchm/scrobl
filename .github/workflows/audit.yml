name: Audit

# Advisories are checked here, not in pull requests: a new one is news about
# `main`, and would fail every pull request open that day.
on:
  schedule:
    - cron: "23 5 * * *"
  push:
    branches: [main]
    paths:
      - Cargo.lock
      - deny.toml
      - .github/workflows/audit.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  advisories:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
      - run: cargo deny check advisories
