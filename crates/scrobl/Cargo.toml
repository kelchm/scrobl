[package]
name = "scrobl"
version = "0.0.0"
description = "The full Last.fm API in async Rust: every method callable, history read and checked page by page, credentials kept out of logs. Unofficial."
# The project README, which cargo copies into the package.
readme = "../../README.md"
keywords = ["lastfm", "last-fm", "scrobble", "music", "api"]
categories = ["api-bindings", "web-programming::http-client"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["client"]
# The async HTTP client. Without it the crate is the I/O-free protocol core.
client = ["dep:reqwest", "dep:tokio"]

[[example]]
name = "recent_tracks"
required-features = ["client"]

[dependencies]
bytes = "1.12.1"
form_urlencoded = "1.2.2"
md-5 = "0.11.0"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"], optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.2", features = ["sync", "time"], optional = true }

[dev-dependencies]
proptest = "1.11.0"
tokio = { version = "1.53.2", features = ["full"] }

[lints]
workspace = true
