[package]
name = "scrobl-cli"
version.workspace = true
description = "Keeps a local SQLite copy of a Last.fm listening history, read and checked page by page. Unofficial."
keywords = ["lastfm", "last-fm", "scrobble", "backup", "sqlite"]
categories = ["command-line-utilities"]
edition.workspace = true
# More than the library's: `rusqlite` 0.41 declares it, and is the first to
# bundle a SQLite without CVE-2026-119375.
rust-version = "1.89"
license.workspace = true
repository.workspace = true
# The tests take the fake Last.fm from the library's tests by path, which
# a package cannot hold. They run from the repository.
exclude = ["tests/"]

[lib]
name = "scrobl_cli"

[[bin]]
name = "scrobl"
path = "src/main.rs"
# The binary shares its name with the library crate, and their
# documentation would land in the same place. Its code is documented as
# `scrobl_cli`.
doc = false

[dependencies]
# SQLite is compiled in ("bundled"), so the tool needs no system library and
# the database format does not depend on the host.
rusqlite = { version = "0.42.0", default-features = false, features = ["bundled", "fallible_uint"] }
scrobl.workspace = true
# The current-thread runtime the client is driven on.
tokio = { version = "1.53.2", features = ["rt"] }

[dev-dependencies]
# For the fake Last.fm shared with the library's tests.
form_urlencoded = "1.2.2"
serde_json = "1.0.151"
tokio = { version = "1.53.2", features = ["full"] }

[lints]
workspace = true
