[advisories]
version = 2

[licenses]
version = 2
# What the locked tree uses, all permissive. A dependency under anything
# else fails CI and gets looked at.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
]
